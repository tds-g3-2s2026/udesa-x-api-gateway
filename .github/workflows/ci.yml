name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    uses: tds-g3-2s2026/udesa-x-platform/.github/workflows/ci-node.yml@main
    secrets: inherit
    with:
      # This service deploys a container, so the image gets built and checked.
      verificar-imagen: true
      puerto-imagen: 8000
      ruta-verificacion: /healthcheck

  # Only a commit on main that passed CI reaches the cluster. The pipeline and
  # what it applies are documented in udesa-x-platform, "Despliegue continuo".
  # No Secret and no database, so no secretos and no migracion.
  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: tds-g3-2s2026/udesa-x-platform/.github/workflows/deploy.yml@main
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      servicio: api-gateway
